<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penalquiz</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020B08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penalquiz">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
<link rel="icon" type="image/png" href="favicon.png?v=8">
<style>
  html,body{margin:0;height:100%;background:#020B08;color:#EFFFF6;font-family:Arial,Helvetica,sans-serif}
  .carga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:#020B08;padding:0 20px}
  .port{width:min(100vw,62vh);aspect-ratio:1;margin:0 -20px -70px;background:linear-gradient(180deg,rgba(2,11,8,0) 55%,#020B08 98%),url(portada-720.jpg?v=8) center/cover no-repeat}
  @media (min-width:700px){ .carga{justify-content:flex-end;padding-bottom:7vh;background:linear-gradient(180deg,rgba(2,11,8,.05) 35%,rgba(2,11,8,.6) 70%,#020B08 96%),url(portada.jpg?v=8) center 30%/cover no-repeat #020B08} .port{display:none} }
  .carga img{width:104px;height:104px;border-radius:24px;box-shadow:0 0 28px rgba(60,255,143,.7);animation:late 1.8s ease-in-out infinite}
  @keyframes late{50%{box-shadow:0 0 46px rgba(60,255,143,.95);transform:scale(1.04)}}
  .barraC{width:min(280px,70vw);height:6px;border-radius:4px;background:rgba(60,255,143,.15);overflow:hidden}
  .barraC i{display:block;height:100%;width:40%;border-radius:4px;background:#3CFF8F;box-shadow:0 0 12px #3CFF8F;animation:corre 1.1s ease-in-out infinite}
  @keyframes corre{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  .carga small{opacity:.85;font-size:15px;max-width:340px;line-height:1.4;text-shadow:0 1px 4px #000}
  @media (prefers-reduced-motion:reduce){ .carga img,.barraC i{animation:none} }
</style>
</head>
<body>
<div class="carga"><div class="port"></div><img src="logo.png?v=8" alt="Penalquiz"><div class="barraC"><i></i></div><small id="msg">Cargando la cancha…</small></div>
<script>
  // ⚠️ ÚNICA LÍNEA PARA EDITAR: pega entre las comillas el link /exec de tu implementación de Apps Script
  const WEB_APP = 'https://script.google.com/macros/s/AKfycbzQ4aLTYSi20gMDzJrSRlR4E6FVxxkFKY78WHLiVey4pYYA4tyDA6rYrNmE60Z2PNzQlg/exec';

  // Guarda el aviso de "instalar app" para que lo use el botón 📲 de la pantalla del juego
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__pqInstalar = e; });

  // Cargador fijo: pide la pantalla del juego al Apps Script, la guarda en el navegador y la muestra.
  // Cuando hay una versión nueva, la app se actualiza sola (no hace falta tocar GitHub).
  (function () {
    var base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
    var msg = function (t) { var m = document.getElementById('msg'); if (m) m.textContent = t; };
    var leer = function () { try { return JSON.parse(localStorage.getItem('pq_ui') || 'null'); } catch (e) { return null; } };
    var guardar = function (d) { try { localStorage.setItem('pq_ui', JSON.stringify(d)); } catch (e) {} };

    function mostrar(d) {
      var head = '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Penalquiz</title>' +
        '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#020B08">' +
        '<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8"><link rel="icon" type="image/png" href="favicon.png?v=8"></head><body>' +
        '<script>window.PQ=' + JSON.stringify({ api: WEB_APP, base: base, v: d.v }) + ';<\/script>';
      document.open();
      document.write(head + d.html + '</body></html>');
      document.close();
    }

    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(WEB_APP)) {
      msg('Falta configurar el link del servidor: abre index.html en GitHub y pega tu link /exec en WEB_APP.');
      return;
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

    var cache = leer();
    if (cache && cache.html) { setTimeout(function () { mostrar(cache); }, 1100); return; }   // portada de carga un instante   // la pantalla compara versiones y recarga sola si hay una nueva

    fetch(WEB_APP + '?ui=1').then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.html) throw new Error('sin pantalla');
      guardar(d); mostrar(d);
    }).catch(function () {
      msg('No pudimos conectar con el servidor. Revisa tu internet o que la implementación tenga acceso "Cualquier usuario".');
    });
  })();
</script>
</body>
</html>
